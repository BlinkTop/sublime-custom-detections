name: "SharePoint impersonation with weak authentication"
description: "Detects inbound messages that impersonate SharePoint, come from a non-Microsoft sender domain, show weak DMARC or SPF authentication, and link away from Microsoft-owned domains."
type: "rule"
severity: "medium"
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "Sender analysis"
  - "Content analysis"
  - "Header analysis"
  - "URL analysis"
tags:
  - "sharepoint"
  - "brand-impersonation"
source: |
  // evaluate inbound messages only
  type.inbound

  // identify SharePoint brand language across subject and rendered body content
  and (
    strings.icontains(subject.subject, "sharepoint")
    or strings.icontains(body.current_thread.text, "sharepoint")
    or strings.icontains(body.html.inner_text, "sharepoint")
    or strings.icontains(body.plain.raw, "sharepoint")
  )

  // require the sender to be outside Microsoft and SharePoint-owned domains
  and sender.email.domain.root_domain not in (
    "microsoft.com",
    "office.com",
    "office365.com",
    "sharepoint.com",
    "sharepointonline.com",
    "onmicrosoft.com"
  )

  // require weak sender authentication to elevate confidence in the impersonation signal
  and (
    not headers.auth_summary.dmarc.pass
    or not headers.auth_summary.spf.pass
  )

  // require links away from Microsoft-owned domains and away from the sender root domain
  and any(body.links,
    .href_url.domain.root_domain not in (
      "microsoft.com",
      "office.com",
      "office365.com",
      "sharepoint.com",
      "sharepointonline.com",
      "onmicrosoft.com"
    )
    and .href_url.domain.root_domain != sender.email.domain.root_domain
  )
id: "65f25843-c40d-4973-be38-c7b7d7e19a31"
