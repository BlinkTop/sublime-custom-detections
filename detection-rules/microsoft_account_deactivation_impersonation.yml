name: "Microsoft account deactivation brand impersonation"
description: "Detects Microsoft account deactivation themed messages where Microsoft branding appears in the sender display name, subject, or body, but the sender root domain is not Microsoft-owned. Tuned for deactivation lures using suspicious sender local-parts or IPFS/dweb links."
type: "rule"
severity: "high"
source: |
  // evaluate inbound messages only
  type.inbound

  // require the sender to be outside Microsoft-owned domains
  and sender.email.domain.root_domain not in (
    "microsoft.com",
    "microsoftonline.com",
    "office.com",
    "office365.com",
    "outlook.com",
    "live.com"
  )

  // identify Microsoft brand usage in the sender display name, subject, or body
  and (
    strings.icontains(sender.display_name, "microsoft")
    or strings.icontains(subject.subject, "microsoft")
    or strings.icontains(body.current_thread.text, "microsoft")
  )

  // require account deactivation lure language
  and (
    strings.icontains(subject.subject, "deactivation", "de-activation")
    or strings.icontains(body.current_thread.text, "deactivation", "de-activation", "cancel this request")
  )

  // require either Microsoft-themed sender local-part abuse or IPFS/dweb delivery infrastructure
  and (
    strings.icontains(sender.email.local_part, "microsoft")
    or any(body.links,
      .href_url.domain.root_domain in ("dweb.link", "ipfs.io")
      or strings.icontains(.href_url.url, "ipfs")
    )
  )
tags:
  - "brand-impersonation"
  - "microsoft"
  - "account-deactivation"
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "Social engineering"
  - "IPFS"
detection_methods:
  - "Header analysis"
  - "Sender analysis"
  - "Content analysis"
  - "URL analysis"
id: "5f1b7cc7-ef2b-5f5c-9e22-9f58e5c48c0b"
