name: "VIP impersonation"
description: "Detects executive display-name impersonation using exact and typo-tolerant demo VIP name matching, anomalous sender behavior, and NLU BEC/procurement indicators."
type: "rule"
severity: "medium"
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "Impersonation: VIP"
  - "Social engineering"
detection_methods:
  - "Sender analysis"
  - "Content analysis"
  - "File analysis"
tags:
  - "vip-impersonation"
  - "rfq"
  - "supplier-fraud"
  - "nlu"
source: |
  // evaluate inbound messages only
  type.inbound

  // require anomalous sender behavior or free-email infrastructure
  and (
    profile.by_sender().prevalence in ("new", "outlier")
    or sender.email.domain.root_domain in $free_email_providers
  )

  // identify VIP display-name impersonation or VIP names referenced in body text
  and (
    sender.display_name in~ (
      "Mike McDermott",
      "Maya Chen",
      "Daniel Hart",
      "Priya Shah",
      "Jonathan Reed",
      "Elena Martins",
      "Victor Lang",
      "Rachel Kim",
      "Owen Pierce",
      "Amelia Brooks"
    )
    or strings.ilevenshtein(sender.display_name, "Mike McDermott") <= 2
    or strings.ilevenshtein(sender.display_name, "Maya Chen") <= 2
    or strings.ilevenshtein(sender.display_name, "Daniel Hart") <= 2
    or strings.ilevenshtein(sender.display_name, "Priya Shah") <= 2
    or strings.ilevenshtein(sender.display_name, "Jonathan Reed") <= 2
    or strings.ilevenshtein(sender.display_name, "Elena Martins") <= 2
    or strings.ilevenshtein(sender.display_name, "Victor Lang") <= 2
    or strings.ilevenshtein(sender.display_name, "Rachel Kim") <= 2
    or strings.ilevenshtein(sender.display_name, "Owen Pierce") <= 2
    or strings.ilevenshtein(sender.display_name, "Amelia Brooks") <= 2
    or any([body.plain.raw, body.html.inner_text, body.current_thread.text],
      strings.icontains(., "Mike McDermott")
      or strings.icontains(., "Maya Chen")
      or strings.icontains(., "Daniel Hart")
      or strings.icontains(., "Priya Shah")
      or strings.icontains(., "Jonathan Reed")
      or strings.icontains(., "Elena Martins")
      or strings.icontains(., "Victor Lang")
      or strings.icontains(., "Rachel Kim")
      or strings.icontains(., "Owen Pierce")
      or strings.icontains(., "Amelia Brooks")
    )
  )

  // require BEC intent from Sublime NLU
  and any(ml.nlu_classifier(coalesce(body.html.inner_text, body.current_thread.text)).intents,
    .name == "bec"
  )

  // require request language from Sublime NLU
  and any(ml.nlu_classifier(coalesce(body.html.inner_text, body.current_thread.text)).entities,
    .name == "request"
  )

  // require financial, purchase order, payment, or invoice context
  and (
    any(ml.nlu_classifier(coalesce(body.html.inner_text, body.current_thread.text)).entities,
      .name == "financial"
    )
    or any(ml.nlu_classifier(coalesce(body.html.inner_text, body.current_thread.text)).tags,
      .name in ("purchase_order", "payment", "invoice")
    )
  )

  // require sender and organization entities to support relationship/business-context analysis
  and any(ml.nlu_classifier(coalesce(body.html.inner_text, body.current_thread.text)).entities,
    .name == "sender"
  )
  and any(ml.nlu_classifier(coalesce(body.html.inner_text, body.current_thread.text)).entities,
    .name == "org"
  )

  // exclude known legitimate Pfizer sender domains for this scenario
  and sender.email.domain.root_domain not in (
    "pfizer.com",
    "pfizer.be"
  )